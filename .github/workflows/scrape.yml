name: Scrape organiser sites for new events

on:
  schedule:
    - cron: "0 19 * * 6"   # Saturday 19:00 UTC = Sunday 05:00 AEST (see note below on daylight saving)
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dateutil duckduckgo-search

      - name: Configure git identity
        run: |
          git config user.name "on-the-floor-scraper"
          git config user.email "actions@users.noreply.github.com"

      - name: Run scraper
        id: scrape
        run: python event-calendar/scripts/scrape_events.py | tee scrape_output.log

      - name: Commit updated sources.json
        run: |
          git add event-calendar/data/sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sources.json (strikes/discoveries/pruning)"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to sources.json this run."
          fi

      - name: Open one PR per new candidate event
        id: open_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "" > email_summary.txt
          FOUND_ANY=false

          for f in $(grep '^CANDIDATE_FILE::' scrape_output.log | sed 's/CANDIDATE_FILE:://'); do
            if [ ! -f "$f" ]; then
              echo "  $f no longer exists (already processed this run?) — skipping"
              continue
            fi
            id=$(basename "$f" .json)
            branch="scraper/candidate-$id"

            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "  $branch already exists remotely (still awaiting your review from a previous run) — skipping duplicate PR"
              continue
            fi

            FOUND_ANY=true
            name=$(python -c "import json; print(json.load(open('$f'))['name'])")
            start=$(python -c "import json; print(json.load(open('$f'))['start_date'])")
            end=$(python -c "import json; print(json.load(open('$f'))['end_date'])")
            source_url=$(python -c "import json; print(json.load(open('$f')).get('source_url',''))")
            city=$(python -c "import json; print(json.load(open('$f')).get('city','') or '(not extracted — fill in manually if approving)')")
            country=$(python -c "import json; print(json.load(open('$f')).get('country','') or '(not extracted — fill in manually if approving)')")
            types=$(python -c "import json; print(', '.join(json.load(open('$f')).get('types', ['Other'])))")
            multiday=$(python -c "import json; print(json.load(open('$f')).get('multiday', False))")

            git checkout -b "$branch" main
            git add "$f"
            git commit -m "Scraper: candidate event $id"
            git push origin "$branch"

            pr_body="Found by the weekly scraper. Source: $source_url — check it before approving.\n\n**If merged, this is exactly what gets added to events.json:**\n\n| Field | Value |\n|---|---|\n| Name | $name |\n| City | $city |\n| Country | $country |\n| Start date | $start |\n| End date | $end |\n| Multi-day | $multiday |\n| Type | $types |\n\nCity/country/type are the scraper's best guess (or blank if it couldn't tell) — edit the candidate file in this PR directly before merging if anything needs correcting.\n\nMerging this PR adds the event to events.json. Closing it without merging records it as rejected so it won't be proposed again."
            pr_url=$(gh pr create \
              --title "New candidate event: $name" \
              --body "$(printf '%b' "$pr_body")" \
              --head "$branch" --base main)

            echo "----------------------------------------" >> email_summary.txt
            echo "Event: $name" >> email_summary.txt
            echo "Dates: $start to $end" >> email_summary.txt
            echo "Source: $source_url" >> email_summary.txt
            echo "Review (Approve = Merge, Deny = Close): $pr_url" >> email_summary.txt

            git checkout main
          done

          echo "found_any=$FOUND_ANY" >> "$GITHUB_OUTPUT"

      - name: Send summary email
        if: steps.open_prs.outputs.found_any == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: On the Floor Scraper <${{ secrets.GMAIL_ADDRESS }}>
          to: ${{ secrets.GMAIL_ADDRESS }}
          subject: "On the Floor: new candidate events to review"
          body: file://email_summary.txt

      - name: Send failure alert
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: On the Floor Scraper <${{ secrets.GMAIL_ADDRESS }}>
          to: ${{ secrets.GMAIL_ADDRESS }}
          subject: "On the Floor: scraper run FAILED"
          body: "The weekly scraper run failed before completing. Check the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
